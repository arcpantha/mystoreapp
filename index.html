<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blessings Clinic</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: linear-gradient(135deg, #eef2f3 0%, #e4e8ce 100%);
      --card-bg: #ffffff;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
      --input-bg: #e2e8f0;
      --accent: #10b981;
      --accent-hover: #059669;
      --card-border: #cbd5e1;
      --btn-bg: #0284c7;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --accent: #10b981;
      --accent-hover: #059669;
      --card-border: #334155;
      --btn-bg: #0284c7;
    }

    * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; }
    body { background: var(--bg); min-height: 100vh; color: var(--text); margin: 0; padding: 12px; transition: background 0.3s, color 0.3s; }
    .container { max-width: 650px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.4rem; color: #10b981; margin: 0; display: flex; align-items: center; gap: 6px; }
    .theme-btn { background: var(--border); border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; color: var(--text); font-weight: bold; font-size: 0.8rem; }
    
    .nav-tabs { display: flex; background: var(--card-bg); padding: 4px; border-radius: 12px; margin-bottom: 12px; gap: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .nav-tab { flex: 1; text-align: center; padding: 10px 4px; border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--subtext); border: none; background: transparent; transition: 0.2s; font-size: 0.85rem; }
    .nav-tab.active { background: var(--accent); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--card-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .card h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }
    
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; color: var(--subtext); }
    input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 0.9rem; }
    
    .med-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .med-row input[type="text"] { flex: 1.2; }
    .med-row select { flex: 2; }
    .med-row input[type="number"] { flex: 1; }
    .med-row button { flex: 0.8; background: #0284c7; color: white; border: none; font-weight: bold; }
    
    .med-list { font-size: 0.85rem; background: var(--border); padding: 8px; border-radius: 8px; margin-bottom: 10px; min-height: 35px; }
    .med-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn-main { background: var(--accent); color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 6px; }
    .btn-main:hover { background: var(--accent-hover); }

    .patient-card { background: var(--card-bg); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 10px; padding: 10px; margin-bottom: 8px; position: relative; }
    .patient-card.unpaid { border-left-color: #ef4444; }
    .patient-header { display: flex; justify-content: space-between; align-items: center; }
    .patient-name { font-weight: bold; font-size: 1rem; }
    .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
    .tag.paid { background: #10b98122; color: #10b981; }
    .tag.unpaid { background: #ef444422; color: #ef4444; }
    .card-actions { display: flex; gap: 6px; margin-top: 8px; }
    .action-btn { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: auto; }
    .btn-reopen { background: #10b981; color: white; }
    .btn-delete { background: #ef4444; color: white; }

    .debt-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🏥 BLESSINGS CLINIC</h1>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙 Dark Mode</button>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" id="tab-btn-entry" onclick="switchTab('entry')">📝 Entry</button>
      <button class="nav-tab" id="tab-btn-records" onclick="switchTab('records')">📋 Records & Stock</button>
      <button class="nav-tab" id="tab-btn-analytics" onclick="switchTab('analytics')">📊 Analytics</button>
    </div>

    <!-- ENTRY TAB -->
    <div id="tab-entry" class="tab-content active">
      <div class="card">
        <h2 id="form-title">🩺 Patient Consultation & Care Input</h2>
        <input type="hidden" id="editing-patient-id" value="">
        
        <div class="form-group">
          <input type="text" id="patient-name" placeholder="Patient Full Name">
        </div>
        <div class="form-group">
          <input type="text" id="diagnosis" placeholder="Diagnosis / Medical Procedure">
        </div>
        
        <label>💊 Prescribe Medications from Inventory:</label>
        <div class="med-row">
          <input type="text" id="drug-search" placeholder="🔍 Search drug..." oninput="filterDrugDropdown()">
          <select id="drug-select">
            <option value="">-- Select Drug --</option>
          </select>
          <input type="number" id="drug-qty" placeholder="Qty" min="1">
          <button onclick="addMedication()">+ Add</button>
        </div>
        
        <div class="med-list" id="selected-meds">
          <em style="color:var(--subtext)">No drugs selected yet.</em>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Meds Subtotal:</label>
            <input type="number" id="meds-total" value="0.00" readonly>
          </div>
          <div class="form-group">
            <label>Service / Labor Charge:</label>
            <input type="number" id="service-charge" value="0.00" oninput="calculateTotal()">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Total Fee Charged:</label>
            <input type="number" id="total-fee" value="0.00" readonly>
          </div>
          <div class="form-group">
            <label>Payment Status:</label>
            <select id="payment-status">
              <option value="Paid">✅ Paid</option>
              <option value="Unpaid">❌ Unpaid / Pending</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <select id="patient-status">
            <option value="Active">🟡 Active / In Treatment</option>
            <option value="Completed">🟢 Completed & Discharged</option>
          </select>
        </div>

        <button class="btn-main" id="save-btn" onclick="savePatientRecord()">💾 Save Patient Record & Print Receipt</button>
      </div>

      <div class="card">
        <h2>📋 Record Patient Credit / Debt</h2>
        <div class="form-group">
          <input type="text" id="debt-name" placeholder="Patient Name">
        </div>
        <div class="form-group">
          <input type="text" id="debt-desc" placeholder="Items / Treatment Owed">
        </div>
        <div class="grid-2">
          <input type="number" id="debt-amount" placeholder="Amount Owed (USh)">
          <button class="btn-main" style="margin:0; background:var(--btn-bg);" onclick="saveDebtRecord()">📌 Log Debt</button>
        </div>
      </div>
    </div>

    <!-- RECORDS TAB -->
    <div id="tab-records" class="tab-content">
      <div class="card">
        <h2>🟡 Active / In-Treatment Patients</h2>
        <div id="active-patients-list"></div>

        <h2>🟢 Completed Patient Care Logs</h2>
        <div id="completed-patients-list"></div>
      </div>

      <div class="card">
        <h2>💳 Patient Debt & Bill Tracker</h2>
        <div id="debt-list"></div>
      </div>

      <div class="card">
        <h2>📦 Pharmacy Counter & Drug Register</h2>
        <input type="text" id="stock-search" placeholder="🔍 Search medicine stock..." oninput="renderStock()" style="margin-bottom:10px;">
        <div id="stock-list"></div>
        <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
        <h3>➕ Add New Drug to Stock</h3>
        <div class="grid-2">
          <input type="text" id="new-drug-name" placeholder="Drug Name">
          <input type="number" id="new-drug-price" placeholder="Unit Price">
        </div>
        <div class="grid-2" style="margin-top:6px;">
          <input type="number" id="new-drug-stock" placeholder="Initial Stock Qty">
          <button class="btn-main" style="margin:0; background:var(--btn-bg);" onclick="addNewDrug()">Add to Register</button>
        </div>
      </div>
    </div>

    <!-- ANALYTICS TAB -->
    <div id="tab-analytics" class="tab-content">
      <div class="card">
        <h2>📊 Financial Overview</h2>
        <canvas id="revenueChart"></canvas>
      </div>
    </div>

  </div>
    <script>
    let currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);

    const defaultStock = [
      { id: '1', name: 'Paracetamol', price: 100, stock: 100 },
      { id: '2', name: 'Coartem', price: 2000, stock: 50 },
      { id: '3', name: 'Amoxicillin', price: 2500, stock: 40 }
    ];

    function getStoredData() {
      return {
        stock: JSON.parse(localStorage.getItem('clinic_stock')) || defaultStock,
        patients: JSON.parse(localStorage.getItem('clinic_patients')) || [],
        debts: JSON.parse(localStorage.getItem('clinic_debts')) || [],
        adminPin: '14324'
      };
    }

    function saveData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
      document.getElementById('theme-btn').innerText = currentTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      const tabBtn = document.getElementById(`tab-btn-${tabId}`);
      if (tabBtn) tabBtn.classList.add('active');
      
      const content = document.getElementById(`tab-${tabId}`);
      if (content) content.classList.add('active');
      
      if (tabId === 'records') renderRecords();
    }

    let selectedMeds = [];

    function populateDrugDropdown() {
      const data = getStoredData();
      const select = document.getElementById('drug-select');
      select.innerHTML = '<option value="">-- Select Drug --</option>';
      data.stock.forEach(item => {
        select.innerHTML += `<option value="${item.id}">${item.name} (USh ${item.price}) - Stock: ${item.stock}</option>`;
      });
    }

    function filterDrugDropdown() {
      const query = document.getElementById('drug-search').value.toLowerCase();
      const data = getStoredData();
      const select = document.getElementById('drug-select');
      select.innerHTML = '<option value="">-- Select Drug --</option>';
      data.stock.filter(item => item.name.toLowerCase().includes(query)).forEach(item => {
        select.innerHTML += `<option value="${item.id}">${item.name} (USh ${item.price}) - Stock: ${item.stock}</option>`;
      });
    }

    function addMedication() {
      const drugId = document.getElementById('drug-select').value;
      const qty = parseInt(document.getElementById('drug-qty').value);
      if (!drugId || !qty || qty <= 0) return alert('Please select a drug and enter valid quantity');

      const data = getStoredData();
      const drug = data.stock.find(d => d.id === drugId);

      if (qty > drug.stock) return alert('Not enough stock available!');

      selectedMeds.push({ id: drug.id, name: drug.name, qty: qty, price: drug.price, total: drug.price * qty });
      renderSelectedMeds();
    }

    function renderSelectedMeds() {
      const list = document.getElementById('selected-meds');
      if (selectedMeds.length === 0) {
        list.innerHTML = '<em style="color:var(--subtext)">No drugs selected yet.</em>';
        document.getElementById('meds-total').value = '0.00';
        calculateTotal();
        return;
      }

      let html = '';
      let subtotal = 0;
      selectedMeds.forEach((m, idx) => {
        subtotal += m.total;
        html += `<div class="med-item">
          <span>${m.name} x${m.qty} (USh ${m.total})</span>
          <button style="width:auto; padding:2px 6px; background:#ef4444; color:white; border:none; border-radius:4px;" onclick="removeMed(${idx})">✕</button>
        </div>`;
      });
      list.innerHTML = html;
      document.getElementById('meds-total').value = subtotal.toFixed(2);
      calculateTotal();
    }

    function removeMed(index) {
      selectedMeds.splice(index, 1);
      renderSelectedMeds();
    }

    function calculateTotal() {
      const medsSub = parseFloat(document.getElementById('meds-total').value) || 0;
      const service = parseFloat(document.getElementById('service-charge').value) || 0;
      document.getElementById('total-fee').value = (medsSub + service).toFixed(2);
    }

    function savePatientRecord() {
      const editingId = document.getElementById('editing-patient-id').value;
      const name = document.getElementById('patient-name').value;
      const diagnosis = document.getElementById('diagnosis').value;
      const serviceCharge = parseFloat(document.getElementById('service-charge').value) || 0;
      const total = parseFloat(document.getElementById('total-fee').value);
      const paymentStatus = document.getElementById('payment-status').value;
      const patientStatus = document.getElementById('patient-status').value;

      if (!name || !diagnosis) return alert('Please enter patient name and diagnosis');

      const data = getStoredData();

      if (editingId) {
        const index = data.patients.findIndex(p => p.id === editingId);
        if (index !== -1) {
          data.patients[index] = {
            ...data.patients[index],
            name,
            diagnosis,
            meds: [...selectedMeds],
            serviceCharge,
            fee: total,
            paymentStatus,
            status: patientStatus
          };
        }
        document.getElementById('editing-patient-id').value = '';
        document.getElementById('form-title').innerText = '🩺 Patient Consultation & Care Input';
        document.getElementById('save-btn').innerText = '💾 Save Patient Record & Print Receipt';
      } else {
        selectedMeds.forEach(m => {
          const item = data.stock.find(s => s.id === m.id);
          if (item) item.stock -= m.qty;
        });

        const newRecord = {
          id: Date.now().toString(),
          name,
          diagnosis,
          meds: [...selectedMeds],
          serviceCharge,
          fee: total,
          paymentStatus,
          status: patientStatus,
          date: new Date().toLocaleString()
        };
        data.patients.unshift(newRecord);
      }

      const debtIndex = data.debts.findIndex(d => d.id === (editingId || data.patients[0].id));
      if (paymentStatus === 'Unpaid') {
        const debtData = {
          id: editingId || data.patients[0].id,
          name: name,
          desc: diagnosis + ' (' + selectedMeds.map(m=>m.name+' x'+m.qty).join(', ') + ')',
          amount: total,
          status: 'Unpaid',
          date: new Date().toLocaleDateString()
        };
        if (debtIndex !== -1) {
          data.debts[debtIndex] = debtData;
        } else {
          data.debts.unshift(debtData);
        }
      } else if (debtIndex !== -1) {
        data.debts[debtIndex].status = 'Paid';
      }

      saveData('clinic_stock', data.stock);
      saveData('clinic_patients', data.patients);
      saveData('clinic_debts', data.debts);

      alert('Patient record saved successfully!');
      resetForm();
      populateDrugDropdown();
    }
          function resetForm() {
      selectedMeds = [];
      renderSelectedMeds();
      document.getElementById('editing-patient-id').value = '';
      document.getElementById('patient-name').value = '';
      document.getElementById('diagnosis').value = '';
      document.getElementById('service-charge').value = '0.00';
      document.getElementById('payment-status').value = 'Paid';
      document.getElementById('patient-status').value = 'Active';
      document.getElementById('form-title').innerText = '🩺 Patient Consultation & Care Input';
      document.getElementById('save-btn').innerText = '💾 Save Patient Record & Print Receipt';
    }

    function reopenPatient(id) {
      const data = getStoredData();
      const p = data.patients.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editing-patient-id').value = p.id;
      document.getElementById('patient-name').value = p.name;
      document.getElementById('diagnosis').value = p.diagnosis;
      document.getElementById('service-charge').value = (p.serviceCharge || 0).toFixed(2);
      document.getElementById('payment-status').value = p.paymentStatus;
      document.getElementById('patient-status').value = p.status;
      
      selectedMeds = p.meds ? [...p.meds] : [];
      renderSelectedMeds();

      document.getElementById('form-title').innerText = '✏️ Edit & Re-open Patient Record';
      document.getElementById('save-btn').innerText = '💾 Update Patient Record';

      switchTab('entry');
    }

    function saveDebtRecord() {
      const name = document.getElementById('debt-name').value;
      const desc = document.getElementById('debt-desc').value;
      const amount = parseFloat(document.getElementById('debt-amount').value);

      if (!name || !amount) return alert('Please fill in debt name and amount');

      const data = getStoredData();
      data.debts.unshift({
        id: Date.now().toString(),
        name,
        desc,
        amount,
        status: 'Unpaid',
        date: new Date().toLocaleDateString()
      });

      saveData('clinic_debts', data.debts);
      alert('Debt record saved!');
      document.getElementById('debt-name').value = '';
      document.getElementById('debt-desc').value = '';
      document.getElementById('debt-amount').value = '';
      renderRecords();
    }

    function renderRecords() {
      const data = getStoredData();

      const activeContainer = document.getElementById('active-patients-list');
      const active = data.patients.filter(p => p.status === 'Active');
      activeContainer.innerHTML = active.length ? '' : '<p style="color:var(--subtext)">No active patients found.</p>';
      active.forEach(p => {
        activeContainer.innerHTML += renderPatientCard(p);
      });

      const completedContainer = document.getElementById('completed-patients-list');
      const completed = data.patients.filter(p => p.status === 'Completed');
      completedContainer.innerHTML = completed.length ? '' : '<p style="color:var(--subtext)">No completed logs.</p>';
      completed.forEach(p => {
        completedContainer.innerHTML += renderPatientCard(p);
      });

      const debtContainer = document.getElementById('debt-list');
      debtContainer.innerHTML = data.debts.length ? '' : '<p style="color:var(--subtext)">No debt records.</p>';
      data.debts.forEach(d => {
        debtContainer.innerHTML += `
          <div class="debt-card">
            <div>
              <strong>👤 ${d.name}</strong> <small>(${d.date})</small><br>
              <small>💊 ${d.desc}</small><br>
              <strong>Owed: USh ${d.amount.toFixed(2)}</strong>
            </div>
            <div style="text-align:right;">
              ${d.status === 'Paid' ? '<span class="tag paid">✅ Paid</span>' : `<button class="action-btn btn-reopen" onclick="markDebtPaid('${d.id}')">Mark Paid</button>`}
              <button class="action-btn btn-delete" style="margin-top:4px;" onclick="deleteDebt('${d.id}')">🗑️ Delete</button>
            </div>
          </div>
        `;
      });

      renderStock();
    }

    function renderPatientCard(p) {
      return `
        <div class="patient-card ${p.paymentStatus.toLowerCase()}">
          <div class="patient-header">
            <span class="patient-name">👤 ${p.name}</span>
            <span class="tag ${p.paymentStatus.toLowerCase()}">${p.paymentStatus}</span>
          </div>
          <small>⏱️ ${p.date}</small><br>
          <small>🩺 Diagnosis: ${p.diagnosis}</small><br>
          <small>💊 Meds: ${p.meds.map(m=>m.name+' x'+m.qty).join(', ') || 'None'}</small><br>
          <strong>Fee: USh ${p.fee.toFixed(2)}</strong>
          <div class="card-actions">
            <button class="action-btn btn-reopen" onclick="reopenPatient('${p.id}')">✏️ Re-open & Edit</button>
            <button class="action-btn btn-delete" onclick="deletePatientRecord('${p.id}')">🗑️ Delete</button>
          </div>
        </div>
      `;
    }

    function markDebtPaid(id) {
      const data = getStoredData();
      const debt = data.debts.find(d => d.id === id);
      if (debt) {
        debt.status = 'Paid';
        saveData('clinic_debts', data.debts);
      }

      const patient = data.patients.find(p => p.id === id);
      if (patient) {
        patient.paymentStatus = 'Paid';
        saveData('clinic_patients', data.patients);
      }

      renderRecords();
    }

    function verifyAdminPIN() {
      const data = getStoredData();
      const pin = prompt('🔑 Enter Admin PIN to perform delete action:');
      if (pin === data.adminPin) return true;
      alert('❌ Incorrect PIN!');
      return false;
    }

    function deletePatientRecord(id) {
      if (!verifyAdminPIN()) return;
      let data = getStoredData();
      data.patients = data.patients.filter(p => p.id !== id);
      saveData('clinic_patients', data.patients);
      renderRecords();
    }

    function deleteDebt(id) {
      if (!verifyAdminPIN()) return;
      let data = getStoredData();
      data.debts = data.debts.filter(d => d.id !== id);
      saveData('clinic_debts', data.debts);
      renderRecords();
    }

    function renderStock() {
      const query = document.getElementById('stock-search')?.value.toLowerCase() || '';
      const data = getStoredData();
      const container = document.getElementById('stock-list');
      container.innerHTML = '';
      data.stock.filter(s => s.name.toLowerCase().includes(query)).forEach(s => {
        container.innerHTML += `
          <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border)">
            <span><strong>${s.name}</strong> (Stock: ${s.stock})</span>
            <span>USh ${s.price.toFixed(2)}</span>
          </div>
        `;
      });
    }

    function addNewDrug() {
      const name = document.getElementById('new-drug-name').value;
      const price = parseFloat(document.getElementById('new-drug-price').value);
      const stock = parseInt(document.getElementById('new-drug-stock').value);

      if (!name || isNaN(price) || isNaN(stock)) return alert('Fill in all drug fields!');

      const data = getStoredData();
      data.stock.push({ id: Date.now().toString(), name, price, stock });
      saveData('clinic_stock', data.stock);
      alert('Drug added to inventory!');
      populateDrugDropdown();
      renderRecords();
    }

    populateDrugDropdown();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
