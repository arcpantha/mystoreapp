<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLESSINGS CLINIC</title>
    <!-- Medical Icon for Home Screen & Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a192f'/><path d='M32 50h36M50 32v36' stroke='%239ef01a' stroke-width='12' stroke-linecap='round'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a192f'/><path d='M32 50h36M50 32v36' stroke='%239ef01a' stroke-width='12' stroke-linecap='round'/></svg>">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s, color 0.3s; }
    
    /* LIGHT MODE (Vibrant Gradient Background) */
    body.light-mode { 
      background: linear-gradient(135deg, #0a192f 0%, #005c53 35%, #00b4d8 70%, #9ef01a 100%);
      background-attachment: fixed;
      margin: 0; 
      padding: 16px; 
      color: #1a202c; 
      min-height: 100vh;
    }

    body.light-mode .card {
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); 
    }

    body.light-mode h3 { color: #0a192f; border-bottom: 2px solid #e2e8f0; }
    body.light-mode label { color: #4a5568; }
    body.light-mode input, body.light-mode select { border: 1px solid #cbd5e0; background: #f8fafc; color: #1a202c; }
    body.light-mode .metric { color: #4a5568; }
    body.light-mode .metric span { color: #1a202c; }

    /* DARK MODE */
    body.dark-mode { 
      background: #0f172a;
      margin: 0; 
      padding: 16px; 
      color: #f1f5f9; 
      min-height: 100vh;
    }

    body.dark-mode .card {
      background: #1e293b; 
      border: 1px solid #334155;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); 
    }

    body.dark-mode h3 { color: #38bdf8; border-bottom: 2px solid #334155; }
    body.dark-mode label { color: #94a3b8; }
    body.dark-mode input, body.dark-mode select { border: 1px solid #475569; background: #0f172a; color: #f1f5f9; }
    body.dark-mode .metric { color: #94a3b8; }
    body.dark-mode .metric span { color: #f1f5f9; }

    /* Custom Logo Styling */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .logo-badge {
      background: rgba(10, 25, 47, 0.9);
      border: 2px solid #9ef01a;
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .logo-icon {
      background: #9ef01a;
      color: #0a192f;
      font-weight: 900;
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-text {
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    
    h3 { margin-top: 0; font-size: 18px; padding-bottom: 8px; }

    .card { 
      padding: 18px; 
      border-radius: 16px; 
      margin-bottom: 16px; 
    }
    
    label { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 12px; margin: 6px 0 14px; border-radius: 8px; font-size: 15px; outline: none; }

    .btn { border: none; padding: 10px 16px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    
    .btn-plus { background: #22c55e; color: white; border-radius: 50%; width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .btn-minus { background: #ef4444; color: white; border-radius: 50%; width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; border-radius: 8px; padding: 6px 10px; font-size: 14px; margin-left: 8px; }
    
    .btn-cloud { background: linear-gradient(135deg, #0a192f, #00b4d8); color: white; width: 100%; padding: 14px; font-size: 16px; box-shadow: 0 4px 10px rgba(0, 180, 216, 0.3); }
    .btn-add { background: linear-gradient(135deg, #005c53, #9ef01a); color: #0a192f; width: 100%; padding: 12px; font-size: 16px; margin-top: 5px; }
    .btn-theme { background: #334155; color: #f1f5f9; width: 100%; padding: 10px; font-size: 14px; margin-bottom: 15px; border-radius: 8px; }

    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(148, 163, 184, 0.2); }
    .item-row:last-child { border-bottom: none; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .qty-display { font-size: 18px; font-weight: bold; min-width: 24px; text-align: center; }

    .metric { font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .metric span { font-weight: bold; }
    .profit-row { font-size: 18px; font-weight: bold; margin-top: 12px; padding-top: 10px; border-top: 2px solid rgba(148, 163, 184, 0.2); }
  </style>
</head>
<body class="light-mode">

  <!-- BRAND LOGO HEADER -->
  <div class="logo-container">
    <div class="logo-badge">
      <div class="logo-icon">✚</div>
      <div class="logo-text">BLESSINGS CLINIC</div>
    </div>
  </div>

  <!-- 1. CLOUD SYNC -->
  <div class="card">
    <button class="btn btn-cloud" onclick="uploadDataToCloud()">☁️ Sync / Upload to Cloud</button>
    <p id="sync-status" style="font-size: 12px; opacity: 0.8; text-align: center; margin-top: 8px; margin-bottom: 0;"></p>
  </div>

  <!-- 2. CURRENCY & SETTINGS -->
  <div class="card">
    <h3>⚙️ App Settings & Theme</h3>
    
    <button class="btn btn-theme" onclick="toggleTheme()" id="theme-btn">🌙 Switch to Dark Mode</button>

    <label>Select Currency Symbol:</label>
    <select id="currency-select" onchange="updateSettings()">
      <option value="$">USD ($)</option>
      <option value="USh ">UGX (USh)</option>
      <option value="KSh ">KES (KSh)</option>
      <option value="₦">NGN (₦)</option>
      <option value="€">EUR (€)</option>
      <option value="£">GBP (£)</option>
      <option value="R">ZAR (R)</option>
    </select>

    <label>Number of Workers:</label>
    <input type="number" id="num-workers" placeholder="1" oninput="updateSettings()">
    
    <label>Monthly Wage per Worker:</label>
    <input type="number" id="monthly-wage" placeholder="300" oninput="updateSettings()">
  </div>

  <!-- 3. ADD PRODUCT -->
  <div class="card">
    <h3>➕ Add Product</h3>
    <label>Product Name:</label>
    <input type="text" id="p-name" placeholder="e.g. Paracetamol, Bandages">
    
    <label>Cost Price (<span class="curr-symbol">$</span>):</label>
    <input type="number" id="p-cost" placeholder="0.00">
    
    <label>Selling Price (<span class="curr-symbol">$</span>):</label>
    <input type="number" id="p-price" placeholder="0.00">
    
    <button class="btn btn-add" onclick="addProduct()">Save Product</button>
  </div>

  <!-- 4. DAILY REGISTER -->
  <div class="card">
    <h3>🛒 Today's Register</h3>
    <div id="product-list"></div>
  </div>

  <!-- 5. FINANCIAL SUMMARY -->
  <div class="card">
    <h3>📊 Today's Summary</h3>
    <div class="metric">Total Revenue: <span id="summary-income">$0.00</span></div>
    <div class="metric">Cost of Goods Sold: <span id="summary-cogs">$0.00</span></div>
    <div class="metric">Daily Worker Payroll: <span id="summary-payroll">$0.00</span></div>
    <div class="metric profit-row">Net Profit Today: <span id="summary-profit" style="color: #22c55e;">$0.00</span></div>
  </div>

  <script>
    // ==========================================
    // 🔑 PASTE YOUR FIREBASE KEYS DIRECTLY BELOW 
    // ==========================================
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAS49B83gZt2Od1XVlBlQ3VXZ-EGR1w2UE",
  authDomain: "trackify-deeb0.firebaseapp.com",
  projectId: "trackify-deeb0",
  storageBucket: "trackify-deeb0.firebasestorage.app",
  messagingSenderId: "685359390375",
  appId: "1:685359390375:web:648d494d48b663f62e4582",
  measurementId: "G-6C948M3V7C"
};
    // ==========================================

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function getStoredData() {
      const defaultData = { products: [], sales: {}, workers: 1, wage: 300, currency: 'USh ', theme: 'light' };
      return JSON.parse(localStorage.getItem('store_app_data')) || defaultData;
    }

    function saveData(data) {
      localStorage.setItem('store_app_data', JSON.stringify(data));
    }

    // Toggle Dark / Light Theme
    function toggleTheme() {
      const data = getStoredData();
      data.theme = (data.theme === 'dark') ? 'light' : 'dark';
      saveData(data);
      applyTheme(data.theme);
    }

    function applyTheme(theme) {
      const btn = document.getElementById('theme-btn');
      if (theme === 'dark') {
        document.body.className = 'dark-mode';
        btn.innerText = '☀️ Switch to Light Mode';
      } else {
        document.body.className = 'light-mode';
        btn.innerText = '🌙 Switch to Dark Mode';
      }
    }

    // Update worker/wage/currency settings safely without breaking inputs
    function updateSettings() {
      const data = getStoredData();
      data.currency = document.getElementById('currency-select').value;
      data.workers = parseInt(document.getElementById('num-workers').value) || 0;
      data.wage = parseFloat(document.getElementById('monthly-wage').value) || 0;
      saveData(data);
      renderApp();
    }

    function addProduct() {
      const name = document.getElementById('p-name').value;
      const cost = parseFloat(document.getElementById('p-cost').value) || 0;
      const price = parseFloat(document.getElementById('p-price').value) || 0;
      if (!name) return alert('Enter product name');

      const data = getStoredData();
      data.products.push({ id: Date.now(), name, cost, price });
      saveData(data);

      document.getElementById('p-name').value = '';
      document.getElementById('p-cost').value = '';
      document.getElementById('p-price').value = '';
      renderApp();
    }

    function removeProduct(productId) {
      if (!confirm("Are you sure you want to delete this product?")) return;
      const data = getStoredData();
      data.products = data.products.filter(p => p.id !== productId);
      delete data.sales[productId];
      saveData(data);
      renderApp();
    }

    function updateSales(productId, change) {
      const data = getStoredData();
      const current = data.sales[productId] || 0;
      data.sales[productId] = Math.max(0, current + change);
      saveData(data);
      renderApp();
    }

    function renderApp() {
      const data = getStoredData();
      const sym = data.currency || '$';

      // Update static symbol labels
      document.querySelectorAll('.curr-symbol').forEach(el => el.innerText = sym);

      // Render Products in Register
      const listContainer = document.getElementById('product-list');
      listContainer.innerHTML = '';
      let totalIncome = 0;
      let totalCogs = 0;

      if (data.products.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; opacity:0.6; font-size:14px;">No products added yet.</p>';
      }

      data.products.forEach(p => {
        const qty = data.sales[p.id] || 0;
        totalIncome += qty * p.price;
        totalCogs += qty * p.cost;

        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
          <div>
            <strong>${p.name}</strong><br>
            <small style="opacity:0.7;">Cost: ${sym}${p.cost.toFixed(2)} | Price: ${sym}${p.price.toFixed(2)}</small>
          </div>
          <div class="controls">
            <button class="btn btn-minus" onclick="updateSales(${p.id}, -1)">−</button>
            <span class="qty-display">${qty}</span>
            <button class="btn btn-plus" onclick="updateSales(${p.id}, 1)">+</button>
            <button class="btn btn-delete" onclick="removeProduct(${p.id})">🗑️</button>
          </div>
        `;
        listContainer.appendChild(div);
      });

      // Calculate Summary
      const dailyPayroll = (data.workers * data.wage) / 30.0;
      const netProfit = totalIncome - (totalCogs + dailyPayroll);

      document.getElementById('summary-income').innerText = `${sym}${totalIncome.toFixed(2)}`;
      document.getElementById('summary-cogs').innerText = `${sym}${totalCogs.toFixed(2)}`;
      document.getElementById('summary-payroll').innerText = `${sym}${dailyPayroll.toFixed(2)}`;
      document.getElementById('summary-profit').innerText = `${sym}${netProfit.toFixed(2)}`;
    }

    // Initialize Page
    window.onload = function() {
      const data = getStoredData();
      
      // Load saved settings into fields ONCE on initial page load
      document.getElementById('currency-select').value = data.currency || 'USh ';
      document.getElementById('num-workers').value = data.workers !== undefined ? data.workers : 1;
      document.getElementById('monthly-wage').value = data.wage !== undefined ? data.wage : 300;
      
      applyTheme(data.theme || 'light');
      renderApp();
    };

    async function uploadDataToCloud() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "Connecting to Cloud...";

      if (!navigator.onLine) {
        statusEl.innerText = "⚠️ No internet! Data saved locally.";
        return;
      }

      try {
        const todayStr = new Date().toISOString().split('T')[0];
        await db.collection("daily_records").doc(todayStr).set({
          timestamp: new Date(),
          storeData: getStoredData()
        });
        statusEl.innerText = "✅ Successfully uploaded to Cloud!";
      } catch (error) {
        statusEl.innerText = "❌ Upload failed: " + error.message;
      }
    }
  </script>
</body>
</html>
